name: Build and publish

on:
  push:
    paths: ["incoming/**", "config/**", "templates/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Write descriptions for new pictures (free AI, optional)
        run: python scripts/describe.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Save new descriptions back into the folder
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "image-robot"
          git config user.email "image-robot@users.noreply.github.com"
          git add incoming
          if ! git diff --cached --quiet; then
            git commit -m "Add picture descriptions written by the robot"
            git pull --rebase -q origin main && git push -q origin HEAD:main || echo "Could not save descriptions this time; they will be written again next run."
          fi

  deploy:
    # Only the main branch goes live. Other branches just prove the build works.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  check-live:
    # After publishing, open the live pages to prove they are really there.
    needs: deploy
    runs-on: ubuntu-latest
    env:
      BASE: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Live home page loads
        run: |
          for i in 1 2 3 4 5 6 7 8; do curl -fsS -o /dev/null "${BASE}?ci=${{ github.run_id }}" && exit 0; sleep 15; done; exit 1
      - name: Live sitemap loads
        run: |
          for i in 1 2 3 4 5 6 7 8; do curl -fsS -o /dev/null "${BASE}sitemap.xml?ci=${{ github.run_id }}" && exit 0; sleep 15; done; exit 1
      - name: Newest page listed in the sitemap loads
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            last=$(curl -fsS "${BASE}sitemap.xml?ci=${{ github.run_id }}" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | tail -1)
            [ -n "$last" ] && curl -fsS -o /dev/null "${last}?ci=${{ github.run_id }}" && exit 0
            sleep 15
          done
          exit 1
