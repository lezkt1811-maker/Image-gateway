<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<meta name="description" content="{{meta_description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:site_name" content="{{site_name}}">
<meta property="og:type" content="{{og_type}}">
<meta property="og:title" content="{{page_title}}">
<meta property="og:description" content="{{meta_description}}">
<meta property="og:url" content="{{canonical}}">
{{og_image}}
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#070B14">
<link rel="stylesheet" href="{{base}}/style.css">
{{jsonld}}
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{base}}/">{{site_name}}</a>
  <nav>{{nav}}</nav>
</header>
<main>
{{content}}
</main>
<footer class="site-footer">
  <p>&copy; {{year}} {{site_name}}. {{site_description}}.</p>
</footer>
<script>
// Show the Upload button only on a device where the owner has saved their upload token.
try { if (localStorage.getItem("imageRobotToken")) document.getElementById("uploadLink").hidden = false; } catch (e) {}
</script>
</body>
</html>
